name: Verify
on: [push, pull_request]
permissions: {contents: read}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Linux cold-writer check dependency
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Build locked native codec
        run: ./build.sh
      - name: Isolated unit and transaction fixtures
        run: PYTHONPATH=. python3 -B -m unittest discover -v -s tests -p 'test_*.py'
      - name: Install pinned official clients
        run: |
          ./setup-clients.sh
          ./setup-google.sh
      - name: Browser runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/threadway-venv"
          "$RUNNER_TEMP/threadway-venv/bin/pip" install 'playwright==1.56.0'
          "$RUNNER_TEMP/threadway-venv/bin/python" -m playwright install chromium
      - name: Three official CLIs and loopback GUI
        env: {THREADWAY_BROWSER_TEST: '1'}
        run: |
          "$RUNNER_TEMP/threadway-venv/bin/python" -B tests/native_e2e.py --codex "$PWD/bin/clients/node_modules/.bin/codex" --claude "$PWD/bin/clients/node_modules/.bin/claude" --agy "$PWD/bin/google/antigravity" --codec "$PWD/bin/threadway-codec"
      - name: Package the verified revision
        run: |
          os=linux; [ "$(uname -s)" != Darwin ] || os=macos
          arch=$(uname -m); [ "$arch" != aarch64 ] || arch=arm64
          name=threadway-0.3.0-$os-$arch
          python3 scripts/package.py "$RUNNER_TEMP/$name.tar.gz" > "$RUNNER_TEMP/$name.sha256"
          mkdir -p "$RUNNER_TEMP/package-smoke"
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP/package-smoke"
          pkg=$(find "$RUNNER_TEMP/package-smoke" -mindepth 1 -maxdepth 1 -type d)
          "$pkg/bin/threadway" --help
          cd "$RUNNER_TEMP/package-smoke"
          THREADWAY_CODEC="$pkg/bin/threadway-codec" PYTHONPATH="$pkg" python3 -B -m unittest discover -s "$pkg/tests" -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: threadway-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/threadway-0.3.0-*.tar.gz
            ${{ runner.temp }}/threadway-0.3.0-*.sha256
          if-no-files-found: error
