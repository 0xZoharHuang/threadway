name: Verify
on: [push, pull_request]
permissions: {contents: read}
jobs:
  fixture:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: ./build.sh
      - run: PYTHONPATH=. python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: ./setup-clients.sh
      - run: python3 -B tests/native_e2e.py --codex "$PWD/bin/clients/node_modules/.bin/codex" --claude "$PWD/bin/clients/node_modules/.bin/claude" --codec "$PWD/bin/threadway-codec"
